<div class="post-create-page">
  <h1>Создание поста</h1>

  <form
    class="form"
    [formGroup]="postForm">

    <label for="title">Заголовок</label>
    <input
      id="title"
      pInputText
      formControlName="title"
    >

    <label for="body">Текст поста</label>
    <textarea
      id="body"
      rows="6"
      formControlName="body">
    </textarea>

    <label for="tags">Теги (через запятую)</label>
    <input
      id="tags"
      pInputText
      formControlName="tags"
    >
    
    <label for="views">Просмотры</label>
    <input
      id="views"
      pInputText
      type="number"
      formControlName="views"
    >

    <label for="userId">User ID</label>
    <input
      id="userId"
      pInputText
      type="number"
      formControlName="userId"
    >

    <button
      id="createPostBtn"
      pButton
      label="Создать пост"
      (click)="createPost()">
    </button>

    <button
      id="cancelBtn"
      pButton
      label="Отмена"
      (click)="backToPosts()">
    </button>

  </form>
</div>
